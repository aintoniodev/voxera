[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxera"
version = "0.2.0"
description = "Voice/podcast post-production CLI (voxera) powered by pluggable neural backends."
requires-python = ">=3.10"
dependencies = [
    "dpdfnet",
    "deepfilternet",
    "numpy",
    "soundfile",
    "soxr",
    "scipy",
    "pedalboard",
    "pyloudnorm",
    "webrtcvad-wheels",
    "resemblyzer",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pesq", "pystoi"]
# vídeo (fase 3): torch CUDA se instala aparte (ver README, sección vídeo);
# numpy<2 es obligatorio para realesrgan/basicsr.
video = [
    "realesrgan",
    "opencv-python",
    "numpy<2",
]

[project.scripts]
voxera = "voxera.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
