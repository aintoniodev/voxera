[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxera"
version = "0.1.0"
description = "Voice/podcast post-production CLI (voxera) powered by pluggable neural backends."
requires-python = ">=3.10"
dependencies = ["dpdfnet", "deepfilternet"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
voxera = "voxera.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
