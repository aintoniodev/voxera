<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>voxera — haz que tu voz suene profesional</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0d0d12; color: #ddd; margin: 0; padding: 24px; max-width: 900px; margin: 0 auto; }
  h1 { color: #7c5cff; font-size: 22px; }
  .tag { color: #888; font-size: 13px; }
  .card { background: #17171c; border: 1px solid #26262e; border-radius: 12px; padding: 20px; margin: 14px 0; }
  button { background: #7c5cff; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: wait; }
  select, input[type=file] { background: #1f1f26; color: #ddd; border: 1px solid #33333c; border-radius: 8px; padding: 8px; }
  .bar { height: 10px; background: #26262e; border-radius: 5px; overflow: hidden; margin: 4px 0 10px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #7c5cff, #35d0a5); }
  .dim { display: flex; justify-content: space-between; font-size: 13px; }
  .big { font-size: 34px; font-weight: 700; color: #35d0a5; }
  audio { width: 100%; margin-top: 10px; }
  a { color: #7ab8ff; }
</style>
</head>
<body>
<h1>voxera <span class="tag">"Sound like you, only better."</span></h1>

<div class="card">
  <div class="tag">1 · Sube tu audio o vídeo</div>
  <input type="file" id="file" accept=".wav,.mp3,.m4a,.mp4,.mov">
  <div class="tag" style="margin-top:10px">2 · Elige preset</div>
  <select id="preset">
    <option value="creator">creator — natural + clear (-16 LUFS)</option>
    <option value="youtube">youtube — warm + present (-14)</option>
    <option value="podcast">podcast — rich + consistent (-16)</option>
    <option value="social">social — loud + punchy (-14)</option>
    <option value="bad-room">bad-room — ruido + eco (-16)</option>
  </select>
  <div style="margin-top:14px"><button id="go">✨ Enhance</button> <span id="status"></span></div>
</div>

<div class="card" id="result" style="display:none">
  <div class="dim"><span>Voice Score</span><span class="big" id="cvs">–</span></div>
  <div id="scoreDelta" class="tag" style="font-size:18px;margin-bottom:6px"></div>
  <div id="verdict" class="tag"></div>
  <div class="tag" style="margin-top:14px">Antes vs después (waveform):</div>
  <canvas id="wave" width="1200" height="240" style="width:100%;height:220px;background:#0c0c10;border-radius:10px;display:block"></canvas>
  <div id="dims" style="margin-top:14px"></div>
  <div class="tag" style="margin-top:12px">Audio procesado:</div>
  <audio id="player" controls></audio>
  <div class="tag" style="margin-top:8px">
    Compara A/B (botones A/B): <a id="abLink" href="/ab-player.html">abrir A/B player con este audio</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let _ac = null;
async function decodeMedia(name) {
  _ac = _ac || new (window.AudioContext || window.webkitAudioContext)();
  const r = await fetch("/media/" + encodeURIComponent(name));
  if (!r.ok) throw new Error("no " + name);
  return _ac.decodeAudioData(await r.arrayBuffer());
}
function wavePeaks(buf, cols) {
  const d = buf.getChannelData(0), block = Math.max(1, Math.floor(d.length / cols));
  const peaks = [];
  for (let x = 0; x < cols; x++) {
    let mn = 1, mx = -1; const s = x * block;
    for (let i = s; i < s + block; i += 8) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    peaks.push({ mn, mx });
  }
  return peaks;
}
function drawWaveRow(ctx, peaks, offsetY, h, color, W) {
  const bw = W / peaks.length;
  ctx.fillStyle = color;
  peaks.forEach((p, i) => {
    const x = i * bw;
    const y0 = offsetY + h * 0.5 + p.mn * h * 0.5;
    const y1 = offsetY + h * 0.5 + p.mx * h * 0.5;
    ctx.fillRect(x, y0, Math.max(1, bw - 1), Math.max(1, y1 - y0));
  });
}
async function drawCompare(origName, afterName) {
  const cv = document.getElementById("wave");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#555"; ctx.font = "15px system-ui";
  ctx.fillText("antes", 12, 22); ctx.fillText("después", 12, H / 2 + 22);
  try {
    const [before, after] = await Promise.all([decodeMedia(origName), decodeMedia(afterName)]);
    const cols = 160;
    drawWaveRow(ctx, wavePeaks(before, cols), 0, H / 2 - 10, "#7ab8ff55", W);
    drawWaveRow(ctx, wavePeaks(after, cols), H / 2 + 10, H / 2 - 10, "#35d0a5", W);
    ctx.fillStyle = "#111"; ctx.fillRect(0, H / 2 - 5, W, 10);
  } catch (e) {
    ctx.fillStyle = "#888"; ctx.font = "14px system-ui";
    ctx.fillText("(no se pudo cargar el waveform: " + e.message + ")", 60, H / 2);
  }
}
$("go").onclick = async function () {
  const f = $("file").files[0];
  if (!f) { $("status").textContent = "sube un archivo primero"; return; }
  $("go").disabled = true; $("status").textContent = "procesando (NN + master)…";
  const form = new FormData();
  form.append("file", f);
  form.append("preset", $("preset").value);
  try {
    const r = await fetch("/enhance", { method: "POST", body: form });
    const data = await r.json();
    if (!data.ok) { $("status").textContent = "error: " + data.error; return; }
    $("result").style.display = "block";
    $("player").src = data.url;
    $("abLink").href = "/ab-player.html?a=" + encodeURIComponent(data.original || "") + "&b=" + encodeURIComponent(data.url.split("/").pop());
    // antes vs después: score delta + waveforms
    const afterCvs = data.report && data.report.score ? data.report.score.cvs : null;
    const beforeCvs = data.report_before && data.report_before.score ? data.report_before.score.cvs : null;
    if (afterCvs != null && beforeCvs != null) {
      const d = (afterCvs - beforeCvs);
      $("scoreDelta").innerHTML = `<b style="color:#8a8a96">${Math.round(beforeCvs)}</b> &rarr; <b style="color:#35d0a5">${Math.round(afterCvs)}</b> <span style="color:#35d0a5">(+${d.toFixed(1)})</span>`;
    }
    drawCompare(data.original, data.url.split("/").pop());
    if (data.report && data.report.score) {
      const s = data.report.score;
      $("cvs").textContent = Math.round(s.cvs);
      $("verdict").textContent = "“" + s.verdict + "”";
      const order = [["noise", "Noise"], ["clarity", "Clarity"], ["loudness", "Loudness"], ["room", "Room"], ["dynamics", "Dynamics"]];
      $("dims").innerHTML = order.map(([k, label]) => {
        const d = s.dimensions[k];
        return `<div class="dim"><span>${label} — ${d.detail}</span><span>${Math.round(d.value)}</span></div>` +
               `<div class="bar"><div style="width:${d.value}%"></div></div>`;
      }).join("");
    }
    $("status").textContent = "✓ listo";
  } catch (e) {
    $("status").textContent = "error de red: " + e;
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
